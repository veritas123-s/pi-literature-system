services:
  cloud:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      CLOUD_HOST: 0.0.0.0
      CLOUD_PORT: 8787
      CLOUD_DATA_DIR: /data
      CLOUD_DEV_AUTH: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../data/cloud:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
